<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C9A46C" />
    <title>FocusForge Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top left, rgba(230, 199, 156, 0.28), transparent 34rem),
          linear-gradient(180deg, #fffdf8 0%, #f8f5f0 100%);
        color: #1a1a1a;
        font-family: Inter, system-ui, sans-serif;
        padding: 24px;
      }

      main {
        width: min(92vw, 460px);
        border: 1px solid #e9ddca;
        border-radius: 32px;
        background: #fffdf8;
        padding: 40px;
        box-shadow: 0 18px 45px rgba(80, 60, 34, 0.08);
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        border-radius: 20px;
        background: #c9a46c;
        color: #fff;
        font-weight: 800;
        font-size: 22px;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(34px, 8vw, 48px);
        line-height: 1.04;
      }

      p {
        margin: 0;
        color: #4a4037;
        font-size: 17px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">F</div>
      <h1>Offline mode</h1>
      <p>
        FocusForge could not load this page from the network. Reopen a page you have visited before,
        or reconnect to sync fresh study data.
      </p>
    </main>
  </body>
</html>
